name: validate

on:
  push:
    branches: [main, develop]
  pull_request:

# Token do GitHub só com leitura; nenhum job precisa escrever no repositório.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.7.0
  KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
  YAMLLINT_VERSION: 1.38.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions fixadas por SHA do commit (o Dependabot mantém atualizado).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Exemplos não têm senhas preenchidas
        run: |
          if grep -nE '^[A-Z_]*PASSWORD=.+' .env.example kubernetes/base/secrets.env.example; then
            echo "::error::Os arquivos de exemplo não podem trazer senhas. Deixe as variáveis *_PASSWORD vazias."
            exit 1
          fi

      - name: Nenhum segredo real versionado
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)secrets\.env$|\.(pem|key)$'; then
            echo "::error::Arquivo de segredo versionado"
            exit 1
          fi

      - name: Gera segredos de teste
        run: |
          ./scripts/generate-secrets.sh compose
          ./scripts/generate-secrets.sh k8s
          ./scripts/check-secrets.sh .env
          ./scripts/check-secrets.sh kubernetes/base/secrets.env

      - name: Docker Compose config
        run: docker compose config -q

      - name: Arquivos do Kubernetes sincronizados
        run: ./scripts/sync-k8s-files.sh --check

      - name: YAML lint
        run: pip install --quiet "yamllint==${YAMLLINT_VERSION}" && yamllint -s .

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Dashboards são JSON válido
        run: for f in grafana/dashboards/*.json; do jq empty "$f"; done

      - name: Kustomize + kubeconform
        run: |
          curl -sSfL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          # Gateway e HTTPRoute (overlay gateway) vêm de CRDs: o esquema sai do
          # catálogo de CRDs do datree.
          for o in local ingress gateway; do
            kubectl kustomize "kubernetes/overlays/$o" | ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done

  # Os scripts e o Makefile rodam no Mac do usuário, que tem ferramentas BSD
  # (sed, grep, awk, tr, stat), bash 3.2 como /bin/sh e GNU make 3.81.
  # Os runners macOS do GitHub não têm Docker, então aqui só testamos isso.
  macos:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Versões das ferramentas do sistema
        run: |
          sw_vers
          uname -m
          /bin/sh --version | head -1
          /usr/bin/make --version | head -1

      - name: make help e make env com o make do sistema (3.81)
        run: |
          /usr/bin/make help | tee help.txt
          grep -q 'check-env' help.txt
          /usr/bin/make env
          /usr/bin/make env | grep -q 'já existe'
          /usr/bin/make check-env

      - name: Gera e confere os segredos com as ferramentas BSD
        run: |
          ./scripts/generate-secrets.sh k8s
          ./scripts/check-secrets.sh kubernetes/base/secrets.env
          for f in .env kubernetes/base/secrets.env; do
            test "$(stat -f %Lp "$f")" = 600
            # Toda senha tem 24 caracteres alfanuméricos
            if grep -E '^[A-Z_]*PASSWORD=' "$f" | cut -d= -f2 | grep -vqE '^[A-Za-z0-9]{24}$'; then
              echo "::error::$f tem senha fora do formato"; exit 1
            fi
          done
          # Arquivo de exemplo (senhas vazias) precisa ser recusado
          if ./scripts/check-secrets.sh .env.example; then exit 1; fi

      - name: Sincronização do Kubernetes ignora .DS_Store
        run: |
          ./scripts/sync-k8s-files.sh --check
          touch grafana/.DS_Store grafana/dashboards/._painel.json
          ./scripts/sync-k8s-files.sh --check
          ./scripts/sync-k8s-files.sh
          test -z "$(find kubernetes/base/files -name .DS_Store -o -name '._*')"
          git diff --exit-code kubernetes/base/files

  # Usuário de Windows sem WSL: gera os segredos com o script PowerShell, no
  # Windows PowerShell 5.1 (o que vem no Windows) e no PowerShell 7.
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Gera os segredos com o generate-secrets.ps1
        run: |
          .\scripts\generate-secrets.ps1
          .\scripts\generate-secrets.ps1 -Target k8s
          $again = .\scripts\generate-secrets.ps1
          if ($again -notmatch 'existe') { throw "sobrescreveu o .env: $again" }

      - name: Formato dos arquivos (UTF-8 sem BOM, LF, senhas de 24 caracteres)
        run: |
          foreach ($f in '.env', 'kubernetes\base\secrets.env') {
            $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $f))
            if ($bytes[0] -eq 0xEF) { throw "$f tem BOM" }
            if ($bytes -contains 13) { throw "$f tem CRLF" }
            $pw = Select-String -Path $f -Pattern '^[A-Z_]*PASSWORD=(.*)$' -CaseSensitive
            if ($pw.Count -lt 4) { throw "$f sem as senhas" }
            foreach ($m in $pw) {
              if ($m.Matches[0].Groups[1].Value -cnotmatch '^[A-Za-z0-9]{24}$') { throw "$f tem senha fora do formato" }
            }
          }

      - name: check-secrets.sh aceita os arquivos (Git Bash)
        shell: bash
        run: |
          ./scripts/check-secrets.sh .env
          ./scripts/check-secrets.sh kubernetes/base/secrets.env

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Sobe o ambiente
        run: |
          ./scripts/generate-secrets.sh compose
          docker compose up -d --wait --wait-timeout 300 postgres postgres-backup zabbix-server zabbix-web zabbix-agent
          docker compose up zabbix-init --exit-code-from zabbix-init
          docker compose up -d --wait --wait-timeout 180 grafana

      - name: Testa Zabbix e Grafana
        run: |
          set -a; . ./.env; set +a
          # A senha padrão do Admin foi trocada no banco antes de a interface
          # web subir, e a extensão pgcrypto usada nisso não ficou no banco.
          docker compose logs zabbix-admin-password | tee /dev/stderr | grep -q 'senha padrão do Admin trocada'
          test "$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "select count(*) from pg_extension where extname = 'pgcrypto'")" = 0
          api() { curl -fsS -H 'Content-Type: application/json-rpc' ${3:+-H "Authorization: Bearer $3"} \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"$1\",\"params\":$2,\"id\":1}" http://localhost:8080/api_jsonrpc.php; }
          # Admin usa a senha nova; a senha padrão "zabbix" não funciona mais
          api user.login "{\"username\":\"Admin\",\"password\":\"$ZABBIX_ADMIN_PASSWORD\"}" | jq -e .result
          api user.login '{"username":"Admin","password":"zabbix"}' | jq -e '.error'
          # Usuário do Grafana lê dados, mas não pode alterar nada
          TOKEN=$(api user.login "{\"username\":\"grafana\",\"password\":\"$ZABBIX_GRAFANA_PASSWORD\"}" | jq -r .result)
          api host.get '{"output":["host"]}' "$TOKEN" | jq -e '.result | length >= 1'
          api host.create '{"host":"x","groups":[{"groupid":"2"}]}' "$TOKEN" | jq -e '.error'
          # Grafana: datasource saudável, dashboards carregados, sem acesso anônimo
          curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" http://localhost:3000/api/datasources/uid/zabbix/health | tee /dev/stderr | jq -e '.status == "OK"'
          curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" "http://localhost:3000/api/search?tag=zabbix" | jq -e 'length >= 2'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/search)" = 401
          # PostgreSQL não fica exposto no host
          ! (exec 3<>/dev/tcp/127.0.0.1/5432) 2>/dev/null

      - name: Testa os alertas do Grafana
        run: |
          set -a; . ./.env; set +a
          g() { curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" "$@"; }
          # As 5 regras provisionadas estão na pasta Zabbix
          g http://localhost:3000/api/v1/provisioning/alert-rules | tee rules.json | jq -e 'length == 5'
          # A consulta das regras ao Zabbix devolve uma série por host, com o
          # label "host" que as mensagens usam. Espera o Zabbix coletar o
          # primeiro valor de CPU do agente (até 5 min).
          jq '{data: (.[] | select(.uid == "zbx-cpu-alta") | .data)}' rules.json > eval.json
          ok=0
          for _ in $(seq 1 60); do
            g -H 'Content-Type: application/json' -d @eval.json http://localhost:3000/api/v1/eval > eval-result.json
            if jq -e '[.results.A.frames[].schema.fields[] | select(.labels.host == "Zabbix server")] | length >= 1' eval-result.json >/dev/null; then
              ok=1; break
            fi
            sleep 5
          done
          jq -c '.results.A.frames[] | [.schema.name, (.schema.fields[] | .labels)]' eval-result.json
          [ "$ok" = 1 ]
          # Toda regra é avaliada sem erro (espera a primeira avaliação, a cada 1 min)
          for _ in $(seq 1 30); do
            g http://localhost:3000/api/prometheus/grafana/api/v1/rules > state.json
            n=$(jq '[.data.groups[].rules[] | select(.lastEvaluation > "2000")] | length' state.json)
            [ "$n" = 5 ] && break
            sleep 5
          done
          jq -c '.data.groups[].rules[] | {name, health, state, lastError}' state.json
          jq -e '[.data.groups[].rules[] | select(.health == "error")] | length == 0' state.json
          # Os exemplos de notificação são aceitos pelo Grafana
          cp grafana/alerting-examples/email.yaml grafana/provisioning/alerting/
          ALERT_EMAIL_TO='ops@example.com' docker compose up -d --wait --wait-timeout 120 grafana
          g http://localhost:3000/api/v1/provisioning/policies | jq -e '.receiver == "E-mail"'
          rm grafana/provisioning/alerting/email.yaml
          sed 's/COLOQUE_O_CHAT_ID_AQUI/-1001234567890/' grafana/alerting-examples/telegram.yaml > grafana/provisioning/alerting/telegram.yaml
          TELEGRAM_BOT_TOKEN='123456:teste' docker compose up -d --wait --wait-timeout 120 grafana
          g http://localhost:3000/api/v1/provisioning/policies | jq -e '.receiver == "Telegram"'
          rm grafana/provisioning/alerting/telegram.yaml

      - name: Testa o backup do banco
        run: |
          # O postgres-backup só fica healthy depois do primeiro backup (feito ao subir).
          docker compose exec -T postgres-backup sh /postgres-backup.sh once
          docker compose exec -T postgres-backup sh /postgres-backup.sh list
          # O backup mais recente tem as tabelas e os dados do Zabbix
          docker compose exec -T postgres-backup sh -c \
            'pg_restore --list "$(ls -t /var/lib/postgresql/backups/*.dump | head -1)"' > toc.txt
          grep -q 'TABLE DATA public hosts ' toc.txt
          grep -q 'TABLE DATA public users ' toc.txt
          # Restaura o backup com o Zabbix parado e confere se o Admin continua lá
          docker compose stop zabbix-server zabbix-web grafana
          f=$(docker compose exec -T postgres-backup sh -c 'ls -t /var/lib/postgresql/backups/*.dump | head -1')
          docker compose exec -T postgres-backup sh /postgres-backup.sh restore "$f"
          set -a; . ./.env; set +a
          test "$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc \
            "select count(*) from users where username='grafana'")" = 1
          docker compose up -d --wait --wait-timeout 180 zabbix-server zabbix-web
          curl -fsS http://localhost:8080/ping

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200
