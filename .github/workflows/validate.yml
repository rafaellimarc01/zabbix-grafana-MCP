name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker Compose config
        run: docker compose --env-file .env.example config -q

      - name: Arquivos do Kubernetes sincronizados
        run: ./scripts/sync-k8s-files.sh --check

      - name: YAML lint
        run: pip install --quiet yamllint && yamllint -s .

      - name: Shellcheck
        run: shellcheck scripts/*.sh

      - name: Dashboards são JSON válido
        run: for f in grafana/dashboards/*.json; do jq empty "$f"; done

      - name: Kustomize + kubeconform
        run: |
          cp kubernetes/base/secrets.env.example kubernetes/base/secrets.env
          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          for o in local ingress; do
            kubectl kustomize kubernetes/overlays/$o | ./kubeconform -strict -summary
          done

  smoke-test:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Sobe o ambiente
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 300 postgres zabbix-server zabbix-web zabbix-agent
          docker compose up zabbix-init --exit-code-from zabbix-init
          docker compose up -d --wait --wait-timeout 180 grafana

      - name: Testa Zabbix e Grafana
        run: |
          set -a; . ./.env; set +a
          curl -fsS -H 'Content-Type: application/json-rpc' \
            -d "{\"jsonrpc\":\"2.0\",\"method\":\"user.login\",\"params\":{\"username\":\"Admin\",\"password\":\"$ZABBIX_ADMIN_PASSWORD\"},\"id\":1}" \
            http://localhost:8080/api_jsonrpc.php | jq -e .result
          curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" http://localhost:3000/api/datasources/uid/zabbix/health | tee /dev/stderr | jq -e '.status == "OK"'
          curl -fsS -u "$GRAFANA_ADMIN_USER:$GRAFANA_ADMIN_PASSWORD" "http://localhost:3000/api/search?tag=zabbix" | jq -e 'length >= 2'

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --tail=200
