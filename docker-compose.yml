# Zabbix + Grafana - ambiente pronto com Docker Compose
# Uso: make env && docker compose up -d   (make env gera o .env com senhas aleatórias)

name: zabbix-grafana

x-zabbix-db-env: &zabbix-db-env
  DB_SERVER_HOST: postgres
  POSTGRES_DB: ${POSTGRES_DB:-zabbix}
  POSTGRES_USER: ${POSTGRES_USER:-zabbix}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode make env)}

# Rotação de logs, para os logs dos containers não encherem o disco.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

# Endurecimento padrão: nenhum privilégio extra e nenhuma capability do Linux.
x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

# Serviços com a imagem do PostgreSQL: usuário "postgres" (uid 70), sem root,
# disco somente leitura e só na rede interna do banco (sem internet e sem porta
# publicada no host).
x-postgres-base: &postgres-base
  image: postgres:${POSTGRES_VERSION:-16-alpine}
  <<: *hardening
  user: "70:70"
  read_only: true
  logging: *logging
  networks: [db]

# Conexão dos clientes (pg_dump, psql) com o banco do Zabbix.
x-postgres-client-env: &postgres-client-env
  PGHOST: postgres
  PGDATABASE: ${POSTGRES_DB:-zabbix}
  PGUSER: ${POSTGRES_USER:-zabbix}
  PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode make env)}

services:
  postgres:
    <<: *postgres-base
    restart: unless-stopped
    tmpfs:
      - /var/run/postgresql
      - /tmp
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zabbix}
      POSTGRES_USER: ${POSTGRES_USER:-zabbix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (rode make env)}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Backup automático do banco do Zabbix: pg_dump todo dia às BACKUP_TIME,
  # guardando BACKUP_KEEP_DAYS dias no volume postgres-backups. Ao subir, já faz
  # um backup se não houver nenhum das últimas 24 h. Usa a mesma imagem do banco
  # (pg_dump da mesma versão), sem root e só na rede interna do banco.
  # Restaurar e copiar para o host: veja "Backup do banco" no README.
  postgres-backup:
    <<: *postgres-base
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *postgres-client-env
      BACKUP_DIR: /var/lib/postgresql/backups
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${TZ:-America/Sao_Paulo}
    # O volume fica em /var/lib/postgresql porque essa pasta já pertence ao
    # usuário postgres (uid 70) na imagem: o Docker cria o volume com esse dono
    # e o container grava sem precisar de root. O tmpfs em .../data só evita o
    # volume anônimo que a imagem declara ali.
    volumes:
      - postgres-backups:/var/lib/postgresql
      - ./scripts/postgres-backup.sh:/postgres-backup.sh:ro
    tmpfs:
      - /tmp
      - /var/lib/postgresql/data
    entrypoint: ["/bin/sh", "/postgres-backup.sh", "loop"]
    # Saudável enquanto existir um backup das últimas 25 h.
    healthcheck:
      test: ["CMD-SHELL", "find /var/lib/postgresql/backups -name '*.dump' -mmin -1500 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 15m
      start_interval: 10s

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:${ZABBIX_VERSION:-alpine-7.0.32}
    restart: unless-stopped
    # O fping (itens de ping ICMP) é setuid e precisa de NET_RAW, por isso
    # este serviço não usa no-new-privileges. Todas as outras capabilities caem.
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *zabbix-db-env
      TZ: ${TZ:-America/Sao_Paulo}
      ZBX_CACHESIZE: 128M
      ZBX_STARTPOLLERS: 10
    ports:
      # Trapper: recebe dados dos agentes ativos e proxies.
      - "${ZABBIX_SERVER_BIND_ADDRESS:-0.0.0.0}:${ZABBIX_SERVER_PORT:-10051}:10051"
    volumes:
      - zabbix-server-data:/var/lib/zabbix
    logging: *logging
    networks: [db, backend]

  # Tarefa única: troca a senha padrão ("zabbix") do Admin direto no banco,
  # antes de a interface web subir. Assim o Admin nunca fica acessível com a
  # senha padrão, mesmo que o zabbix-init falhe. Só mexe no Admin se a senha
  # dele ainda for a padrão.
  zabbix-admin-password:
    <<: *postgres-base
    restart: "no"
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      <<: *postgres-client-env
      ZABBIX_ADMIN_PASSWORD: ${ZABBIX_ADMIN_PASSWORD:?defina ZABBIX_ADMIN_PASSWORD no .env (rode make env)}
    volumes:
      - ./scripts/zabbix-admin-password.sh:/zabbix-admin-password.sh:ro
    entrypoint: ["/bin/sh", "/zabbix-admin-password.sh"]

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_VERSION:-alpine-7.0.32}
    restart: unless-stopped
    <<: *hardening
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
      zabbix-admin-password:
        condition: service_completed_successfully
    environment:
      <<: *zabbix-db-env
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Zabbix
      PHP_TZ: ${TZ:-America/Sao_Paulo}
    ports:
      # Só em 127.0.0.1 por padrão (HTTP sem TLS). Veja BIND_ADDRESS no .env.
      - "${BIND_ADDRESS:-127.0.0.1}:${ZABBIX_WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ping >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *logging
    networks: [db, frontend]

  # Agente que monitora o próprio host "Zabbix server" (vem cadastrado por padrão).
  zabbix-agent:
    image: zabbix/zabbix-agent2:${ZABBIX_VERSION:-alpine-7.0.32}
    restart: unless-stopped
    <<: *hardening
    depends_on:
      - zabbix-server
    hostname: zabbix-agent
    environment:
      ZBX_HOSTNAME: Zabbix server
      ZBX_SERVER_HOST: zabbix-server
      ZBX_ACTIVE_ALLOW: "true"
      TZ: ${TZ:-America/Sao_Paulo}
    logging: *logging
    networks: [backend]

  # Tarefa única: troca a senha padrão do Admin, cria o usuário somente leitura
  # do Grafana e aponta o host "Zabbix server" para o container do agente.
  # É idempotente; pode rodar quantas vezes quiser (docker compose up zabbix-init).
  # Usa a imagem do zabbix-web, que já traz curl e jq: nada é baixado na hora
  # e o container roda sem root.
  zabbix-init:
    image: zabbix/zabbix-web-nginx-pgsql:${ZABBIX_VERSION:-alpine-7.0.32}
    restart: "no"
    <<: *hardening
    read_only: true
    depends_on:
      zabbix-web:
        condition: service_healthy
    environment:
      ZABBIX_URL: http://zabbix-web:8080
      ZABBIX_ADMIN_PASSWORD: ${ZABBIX_ADMIN_PASSWORD:?defina ZABBIX_ADMIN_PASSWORD no .env (rode make env)}
      ZABBIX_GRAFANA_USER: grafana
      ZABBIX_GRAFANA_PASSWORD: ${ZABBIX_GRAFANA_PASSWORD:?defina ZABBIX_GRAFANA_PASSWORD no .env (rode make env)}
      ZABBIX_AGENT_DNS: zabbix-agent
    volumes:
      - ./scripts/zabbix-init.sh:/zabbix-init.sh:ro
    entrypoint: ["/bin/sh", "/zabbix-init.sh"]
    logging: *logging
    networks: [frontend]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-12.4.16}
    restart: unless-stopped
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      zabbix-init:
        condition: service_completed_successfully
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env (rode make env)}
      GF_PLUGINS_PREINSTALL_SYNC: alexanderzobnin-zabbix-app
      # Endurecimento do Grafana
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/zabbix-overview.json
      # O Grafana lê o Zabbix com o usuário somente leitura criado pelo zabbix-init.
      ZABBIX_URL: http://zabbix-web:8080/api_jsonrpc.php
      ZABBIX_USER: grafana
      ZABBIX_PASSWORD: ${ZABBIX_GRAFANA_PASSWORD:?defina ZABBIX_GRAFANA_PASSWORD no .env (rode make env)}
      # Notificações dos alertas (opcional). Só são usadas se você ativar um
      # exemplo de grafana/alerting-examples/. Veja "Alertas" no README.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000/}
      GF_SMTP_ENABLED: ${GRAFANA_SMTP_ENABLED:-false}
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASS:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-grafana@example.com}
      GF_SMTP_STARTTLS_POLICY: ${GRAFANA_SMTP_STARTTLS:-MandatoryStartTLS}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    ports:
      # Só em 127.0.0.1 por padrão (HTTP sem TLS). Veja BIND_ADDRESS no .env.
      - "${BIND_ADDRESS:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    logging: *logging
    networks: [frontend]

volumes:
  postgres-data:
  postgres-backups:
  zabbix-server-data:
  grafana-data:

networks:
  # Só o banco e quem fala com ele. internal: sem saída para a internet.
  db:
    internal: true
  # Zabbix server e agente (o server precisa alcançar os hosts monitorados).
  backend:
  # Interface web, Grafana e init.
  frontend:
