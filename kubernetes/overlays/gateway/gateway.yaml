# Gateway com HTTPS para o Zabbix web e o Grafana.
#
# 1. gatewayClassName: o nome da GatewayClass do seu controlador
#    (kubectl get gatewayclass). Exemplos: "eg" (Envoy Gateway), "traefik",
#    "cilium", "istio", "nginx" (NGINX Gateway Fabric).
# 2. Troque os domínios aqui e nos dois HTTPRoute abaixo.
# 3. Certificado: com cert-manager, descomente a anotação para ele criar o
#    Secret sozinho. Sem cert-manager, crie o Secret com o seu certificado:
#      kubectl -n monitoring create secret tls zabbix-grafana-tls --cert=tls.crt --key=tls.key
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: zabbix-grafana
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt
spec:
  gatewayClassName: eg
  listeners:
    # Porta 80 só para redirecionar para HTTPS (rota "https-redirect").
    - name: http
      protocol: HTTP
      port: 80
    - name: https-zabbix
      protocol: HTTPS
      port: 443
      hostname: zabbix.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: zabbix-grafana-tls
    - name: https-grafana
      protocol: HTTPS
      port: 443
      hostname: grafana.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: zabbix-grafana-tls
---
# Todo acesso por HTTP recebe 301 para HTTPS: as senhas nunca trafegam abertas.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
spec:
  parentRefs:
    - name: zabbix-grafana
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zabbix-web
spec:
  parentRefs:
    - name: zabbix-grafana
      sectionName: https-zabbix
  hostnames: [zabbix.example.com]
  rules:
    - backendRefs:
        - name: zabbix-web
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
spec:
  parentRefs:
    - name: zabbix-grafana
      sectionName: https-grafana
  hostnames: [grafana.example.com]
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
