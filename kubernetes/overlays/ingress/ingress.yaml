# Ingress com HTTPS para o Zabbix web e o Grafana.
#
# Vem pronto para o Traefik (padrão do k3s): as anotações abaixo fazem ele
# atender só em HTTPS (entrypoint "websecure"), então as senhas nunca trafegam
# sem criptografia. Para outro controlador, troque ingressClassName e as
# anotações pelas equivalentes (ex.: HAProxy Ingress:
# haproxy.org/ssl-redirect: "true").
#
# O ingress-nginx (kubernetes/ingress-nginx) foi aposentado em março de 2026 e
# não recebe mais correções de segurança: use outro controlador ou o overlay
# "gateway".
#
# Certificado: com cert-manager, descomente a anotação para ele criar o Secret
# sozinho. Sem cert-manager, crie o Secret com o seu certificado:
#   kubectl -n monitoring create secret tls zabbix-grafana-tls --cert=tls.crt --key=tls.key
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zabbix-grafana
  annotations:
    # cert-manager.io/cluster-issuer: letsencrypt
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts: [zabbix.example.com, grafana.example.com]
      secretName: zabbix-grafana-tls
  rules:
    - host: zabbix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zabbix-web
                port:
                  name: http
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
