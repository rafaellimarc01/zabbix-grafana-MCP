apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zabbix-grafana
  annotations:
    # Descomente se usar cert-manager para gerar certificados TLS:
    # cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  # tls:
  #   - hosts: [zabbix.example.com, grafana.example.com]
  #     secretName: zabbix-grafana-tls
  rules:
    - host: zabbix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zabbix-web
                port:
                  name: http
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
