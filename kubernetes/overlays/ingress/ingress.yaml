apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zabbix-grafana
  annotations:
    # Com cert-manager instalado, descomente para gerar o certificado sozinho:
    # cert-manager.io/cluster-issuer: letsencrypt
    # Sem cert-manager, crie o Secret com o seu certificado:
    #   kubectl -n monitoring create secret tls zabbix-grafana-tls --cert=tls.crt --key=tls.key
    # Enquanto o Secret não existir, o ingress-nginx usa um certificado
    # autoassinado próprio (o navegador vai avisar).
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 16m
spec:
  ingressClassName: nginx
  # HTTPS ligado por padrão: as senhas do Zabbix e do Grafana não trafegam
  # sem criptografia. Troque os domínios aqui e nas regras abaixo.
  tls:
    - hosts: [zabbix.example.com, grafana.example.com]
      secretName: zabbix-grafana-tls
  rules:
    - host: zabbix.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zabbix-web
                port:
                  name: http
    - host: grafana.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  name: http
