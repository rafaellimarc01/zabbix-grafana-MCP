# Para clusters com Ingress Controller (ex.: ingress-nginx), com HTTPS.
# Troque os domínios em ingress.yaml antes de aplicar.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - ingress.yaml

# Atrás de HTTPS, o cookie de sessão do Grafana só trafega criptografado.
patches:
  - target: {kind: Deployment, name: grafana}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
