# Para clusters que usam Ingress (ex.: Traefik, padrão do k3s), com HTTPS.
# Troque os domínios e, se o controlador não for o Traefik, a classe e as
# anotações em ingress.yaml antes de aplicar. Para produção, prefira o overlay
# "gateway" (Gateway API).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Mesmo namespace da base: sem isto, os recursos do overlay e dos componentes
# (NetworkPolicies, MCP) iriam para o namespace "default".
namespace: monitoring

resources:
  - ../../base
  - ingress.yaml

components:
  - ../../components/external-access
