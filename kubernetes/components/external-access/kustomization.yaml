# Partes comuns aos overlays com HTTPS ("gateway" e "ingress").
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - networkpolicy.yaml

# Atrás de HTTPS, o cookie de sessão do Grafana só trafega criptografado.
patches:
  - target: {kind: Deployment, name: grafana}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: GF_SECURITY_COOKIE_SECURE, value: "true"}
