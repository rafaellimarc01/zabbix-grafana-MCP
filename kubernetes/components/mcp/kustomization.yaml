# MCP único para IAs (Claude, ChatGPT...): um pod "mcp" com o mcp-gateway e,
# só dentro do pod (127.0.0.1), os MCPs oficiais do Zabbix e do Grafana e o
# MCP de Kubernetes, todos somente leitura. A IA usa um endereço e um token
# (MCP_PASSWORD do secrets.env). O Service é ClusterIP: nada sai do cluster;
# acesse com "make k8s-mcp" (kubectl port-forward). Veja "MCP" no README.
#
# As ferramentas do Zabbix precisam do Zabbix 8.0. No seu overlay:
#   components:
#     - ../../components/zabbix-8
#     - ../../components/mcp
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - mcp.yaml
  - networkpolicy.yaml

images:
  # O mcp-init só usa o curl desta imagem; serve com o Zabbix 7.0 ou 8.0.
  - name: zabbix/zabbix-web-nginx-pgsql
    newTag: alpine-8.0.0
  - name: zabbix/zabbix-mcp-server
    newTag: alpine-8.0.0
  - name: grafana/mcp-grafana
    newTag: 2.4.0
  - name: quay.io/containers/kubernetes_mcp_server
    newTag: v0.1.3
  - name: python
    newTag: 3.13.18-alpine3.24

configMapGenerator:
  - name: mcp-files
    files:
      # Cópias de mcp-gateway/gateway.py e scripts/mcp-k8s-init.sh
      # (./scripts/sync-k8s-files.sh).
      - files/gateway.py
      - files/mcp-k8s-init.sh
      - kubernetes-mcp.toml
