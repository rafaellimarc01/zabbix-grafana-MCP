# O pod "mcp" não recebe conexões de outros pods (o default-deny-ingress da
# base vale para ele); o port-forward do "make k8s-mcp" não passa por
# NetworkPolicy. Ele só precisa falar com o Zabbix web e com o Grafana, que
# na base só aceitam o Grafana: estas regras liberam o pod "mcp".
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zabbix-web-from-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zabbix-web
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-from-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: mcp
      ports:
        - port: 3000
          protocol: TCP
