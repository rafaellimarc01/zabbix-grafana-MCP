# Troca a senha padrão do Admin, cria o usuário somente leitura do Grafana e
# aponta o host "Zabbix server" para o agente. É idempotente.
# Usa a imagem do zabbix-web, que já traz curl e jq: roda sem root e sem
# baixar nada na hora. O Job se apaga 10 min após terminar; reaplicar roda de novo.
apiVersion: batch/v1
kind: Job
metadata:
  name: zabbix-init
  labels:
    app.kubernetes.io/name: zabbix-init
spec:
  backoffLimit: 10
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-init
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zabbix-init
          image: zabbix/zabbix-web-nginx-pgsql
          command: ["/bin/sh", "/scripts/zabbix-init.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          env:
            - name: ZABBIX_URL
              value: http://zabbix-web:8080
            - name: ZABBIX_AGENT_DNS
              value: zabbix-agent
            - name: ZABBIX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: ZABBIX_ADMIN_PASSWORD}
            - name: ZABBIX_GRAFANA_USER
              value: grafana
            - name: ZABBIX_GRAFANA_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: ZABBIX_GRAFANA_PASSWORD}
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: zabbix-init-script
