apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  labels:
    app.kubernetes.io/name: zabbix-server
spec:
  selector:
    app.kubernetes.io/name: zabbix-server
  ports:
    - name: trapper
      port: 10051
      targetPort: trapper
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  labels:
    app.kubernetes.io/name: zabbix-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql
          # O fping (itens de ping ICMP) é setuid e usa NET_RAW. O perfil
          # "baseline" não deixa adicionar NET_RAW, então derrubamos todas as
          # outras capabilities padrão e mantemos só ela.
          securityContext:
            capabilities:
              drop: [AUDIT_WRITE, CHOWN, DAC_OVERRIDE, FOWNER, FSETID, KILL, MKNOD, NET_BIND_SERVICE, SETFCAP, SETGID, SETPCAP, SETUID, SYS_CHROOT]
          ports:
            - name: trapper
              containerPort: 10051
          envFrom:
            - configMapRef:
                name: zabbix-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_PASSWORD}
            - name: ZBX_CACHESIZE
              value: 128M
            - name: ZBX_STARTPOLLERS
              value: "10"
          readinessProbe:
            tcpSocket:
              port: trapper
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: trapper
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
