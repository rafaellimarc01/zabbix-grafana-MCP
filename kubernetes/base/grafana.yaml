apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 0
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      # Recusa subir se as senhas estiverem vazias ou curtas demais.
      initContainers:
        - name: check-secrets
          image: grafana/grafana
          command:
            - sh
            - -c
            - |
              ok=1
              [ ${#GF_SECURITY_ADMIN_PASSWORD} -ge 12 ] || { echo "GRAFANA_ADMIN_PASSWORD vazia ou com menos de 12 caracteres"; ok=0; }
              [ ${#ZABBIX_PASSWORD} -ge 12 ] || { echo "ZABBIX_GRAFANA_PASSWORD vazia ou com menos de 12 caracteres"; ok=0; }
              [ $ok = 1 ] || { echo "Gere o secrets.env com: make k8s-secrets"; exit 1; }
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_ADMIN_PASSWORD}
            - name: ZABBIX_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: ZABBIX_GRAFANA_PASSWORD}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
      containers:
        - name: grafana
          image: grafana/grafana
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              valueFrom:
                configMapKeyRef: {name: zabbix-config, key: TZ}
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_ADMIN_USER}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_ADMIN_PASSWORD}
            - name: GF_PLUGINS_PREINSTALL_SYNC
              value: alexanderzobnin-zabbix-app
            # Endurecimento do Grafana
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_USERS_ALLOW_ORG_CREATE
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "false"
            - name: GF_SECURITY_DISABLE_GRAVATAR
              value: "true"
            - name: GF_SECURITY_COOKIE_SAMESITE
              value: strict
            - name: GF_SNAPSHOTS_EXTERNAL_ENABLED
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES
              value: "false"
            - name: GF_NEWS_NEWS_FEED_ENABLED
              value: "false"
            - name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH
              value: /var/lib/grafana/dashboards/zabbix-overview.json
            - name: ZABBIX_URL
              value: http://zabbix-web:8080/api_jsonrpc.php
            # Usuário somente leitura criado pelo Job zabbix-init.
            - name: ZABBIX_USER
              value: grafana
            - name: ZABBIX_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: ZABBIX_GRAFANA_PASSWORD}
            # Notificações dos alertas (opcional; veja "Alertas" no README).
            # As chaves vêm do secrets.env e podem faltar (optional: true).
            - name: GF_SERVER_ROOT_URL
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_ROOT_URL, optional: true}
            - name: GF_SMTP_ENABLED
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_SMTP_ENABLED, optional: true}
            - name: GF_SMTP_HOST
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_SMTP_HOST, optional: true}
            - name: GF_SMTP_USER
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_SMTP_USER, optional: true}
            - name: GF_SMTP_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_SMTP_PASS, optional: true}
            - name: GF_SMTP_FROM_ADDRESS
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: GRAFANA_SMTP_FROM, optional: true}
            - name: ALERT_EMAIL_TO
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: ALERT_EMAIL_TO, optional: true}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: TELEGRAM_BOT_TOKEN, optional: true}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 120
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: plugins
              mountPath: /etc/grafana/provisioning/plugins
            - name: dashboard-providers
              mountPath: /etc/grafana/provisioning/dashboards
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
        - name: datasources
          configMap: {name: grafana-datasources}
        - name: plugins
          configMap: {name: grafana-plugins}
        - name: dashboard-providers
          configMap: {name: grafana-dashboard-providers}
        - name: alerting
          configMap: {name: grafana-alerting}
        - name: dashboards
          configMap: {name: grafana-dashboards}
