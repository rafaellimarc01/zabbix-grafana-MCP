apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  labels:
    app.kubernetes.io/name: zabbix-web
spec:
  selector:
    app.kubernetes.io/name: zabbix-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  labels:
    app.kubernetes.io/name: zabbix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        seccompProfile:
          type: RuntimeDefault
      # Troca a senha padrão ("zabbix") do Admin direto no banco antes de a
      # interface web subir: o Admin nunca fica exposto com a senha padrão
      # pelo NodePort/Ingress, mesmo que o init do Grafana falhe depois.
      initContainers:
        - name: zabbix-admin-password
          image: postgres
          command: ["/bin/sh", "/scripts/zabbix-admin-password.sh"]
          securityContext:
            runAsUser: 70
            runAsGroup: 70
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: PGHOST
              valueFrom:
                configMapKeyRef: {name: zabbix-config, key: DB_SERVER_HOST}
            - name: PGDATABASE
              valueFrom:
                configMapKeyRef: {name: zabbix-config, key: POSTGRES_DB}
            - name: PGUSER
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_USER}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_PASSWORD}
            - name: ZABBIX_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: ZABBIX_ADMIN_PASSWORD}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
          volumeMounts:
            - name: admin-password-script
              mountPath: /scripts
            - name: tmp
              mountPath: /tmp
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zabbix-config
          env:
            - name: PHP_TZ
              valueFrom:
                configMapKeyRef: {name: zabbix-config, key: TZ}
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: ZBX_SERVER_NAME
              value: Zabbix
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: admin-password-script
          configMap:
            name: zabbix-admin-password-script
        - name: tmp
          emptyDir: {}
