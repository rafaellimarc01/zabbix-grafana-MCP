apiVersion: v1
kind: Service
metadata:
  name: zabbix-web
  labels:
    app.kubernetes.io/name: zabbix-web
spec:
  selector:
    app.kubernetes.io/name: zabbix-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-web
  labels:
    app.kubernetes.io/name: zabbix-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zabbix-web
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1997
        runAsGroup: 1995
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zabbix-web
          image: zabbix/zabbix-web-nginx-pgsql
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zabbix-config
          env:
            - name: PHP_TZ
              valueFrom:
                configMapKeyRef: {name: zabbix-config, key: TZ}
            - name: ZBX_SERVER_HOST
              value: zabbix-server
            - name: ZBX_SERVER_NAME
              value: Zabbix
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_USER}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: zabbix-secrets, key: POSTGRES_PASSWORD}
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
