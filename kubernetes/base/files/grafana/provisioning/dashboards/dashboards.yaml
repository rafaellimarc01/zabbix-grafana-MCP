# Carrega automaticamente todo JSON colocado em grafana/dashboards/.
apiVersion: 1

providers:
  - name: zabbix-dashboards
    orgId: 1
    folder: Zabbix
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
