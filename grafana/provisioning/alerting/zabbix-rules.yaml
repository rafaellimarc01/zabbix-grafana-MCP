# Alertas pré-configurados do Grafana, lendo os dados do Zabbix.
#
# São 5 regras na pasta "Zabbix" (Alerting > Alert rules no Grafana). Elas valem
# para todos os hosts que usam os templates padrão do Zabbix 7 ("Linux by Zabbix
# agent" e "Zabbix server health") e geram um alerta por host (e por disco).
#
# Para mudar um limite, edite o número em "params" do passo C da regra e
# reinicie o Grafana. As regras provisionadas não podem ser editadas pela tela
# (o arquivo é a fonte da verdade); para isso, duplique a regra no Grafana.
#
# Quem recebe as notificações: veja grafana/alerting-examples/ e a seção
# "Alertas" do README. Sem configurar nada, os alertas aparecem só na tela.

apiVersion: 1

groups:
  - orgId: 1
    name: Infraestrutura
    folder: Zabbix
    interval: 1m
    rules:
      # Host indisponível: item "Zabbix agent availability" < 1 por 3m
      - uid: zbx-host-indisponivel
        title: "Host indisponível"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: zabbix
            model:
              refId: A
              datasource: {type: alexanderzobnin-zabbix-datasource, uid: zabbix}
              queryType: "0"
              group: {filter: "/.*/"}
              host: {filter: "/.*/"}
              application: {filter: ""}
              itemTag: {filter: ""}
              item: {filter: "/^Zabbix agent availability$/"}
              functions: []
              options: {showDisabledItems: false, skipEmptyValues: false, disableDataAlignment: false}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
        noDataState: OK
        execErrState: Error
        for: 3m
        labels:
          severity: critical
          origem: zabbix
        annotations:
          summary: "{{ $labels.host }} está indisponível"
          description: "O Zabbix não consegue falar com o agente de {{ $labels.host }} há pelo menos 3 minutos (valor {{ $values.B.Value }}; 1 = disponível, 0 = indisponível)."
        isPaused: false
      # CPU alta: item "CPU utilization" > 90 por 5m
      - uid: zbx-cpu-alta
        title: "CPU alta"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: zabbix
            model:
              refId: A
              datasource: {type: alexanderzobnin-zabbix-datasource, uid: zabbix}
              queryType: "0"
              group: {filter: "/.*/"}
              host: {filter: "/.*/"}
              application: {filter: ""}
              itemTag: {filter: ""}
              item: {filter: "/^CPU utilization$/"}
              functions: []
              options: {showDisabledItems: false, skipEmptyValues: false, disableDataAlignment: false}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: mean
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          origem: zabbix
        annotations:
          summary: "CPU alta em {{ $labels.host }}"
          description: "A média de uso de CPU em {{ $labels.host }} nos últimos 10 minutos está em {{ humanize $values.B.Value }}% (limite: 90%)."
        isPaused: false
      # Memória alta: item "Memory utilization" > 90 por 5m
      - uid: zbx-memoria-alta
        title: "Memória alta"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: zabbix
            model:
              refId: A
              datasource: {type: alexanderzobnin-zabbix-datasource, uid: zabbix}
              queryType: "0"
              group: {filter: "/.*/"}
              host: {filter: "/.*/"}
              application: {filter: ""}
              itemTag: {filter: ""}
              item: {filter: "/^Memory utilization$/"}
              functions: []
              options: {showDisabledItems: false, skipEmptyValues: false, disableDataAlignment: false}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: mean
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: warning
          origem: zabbix
        annotations:
          summary: "Memória alta em {{ $labels.host }}"
          description: "A média de uso de memória em {{ $labels.host }} nos últimos 10 minutos está em {{ humanize $values.B.Value }}% (limite: 90%)."
        isPaused: false
      # Disco quase cheio: item "FS [*]: Space: Used, in %" > 90 por 10m
      - uid: zbx-disco-cheio
        title: "Disco quase cheio"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 1800, to: 0}
            datasourceUid: zabbix
            model:
              refId: A
              datasource: {type: alexanderzobnin-zabbix-datasource, uid: zabbix}
              queryType: "0"
              group: {filter: "/.*/"}
              host: {filter: "/.*/"}
              application: {filter: ""}
              itemTag: {filter: ""}
              item: {filter: "/^FS \\[.*\\]: Space: Used, in %$/"}
              functions: []
              options: {showDisabledItems: false, skipEmptyValues: false, disableDataAlignment: false}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [90]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          origem: zabbix
        annotations:
          summary: "Disco quase cheio em {{ $labels.host }}"
          description: "{{ $labels.item }} em {{ $labels.host }} está em {{ humanize $values.B.Value }}% (limite: 90%)."
        isPaused: false
      # Fila do Zabbix acumulada: item "Queue over 10 minutes" > 100 por 10m
      - uid: zbx-fila-zabbix
        title: "Fila do Zabbix acumulada"
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 900, to: 0}
            datasourceUid: zabbix
            model:
              refId: A
              datasource: {type: alexanderzobnin-zabbix-datasource, uid: zabbix}
              queryType: "0"
              group: {filter: "/.*/"}
              host: {filter: "/.*/"}
              application: {filter: ""}
              itemTag: {filter: ""}
              item: {filter: "/^Queue over 10 minutes$/"}
              functions: []
              options: {showDisabledItems: false, skipEmptyValues: false, disableDataAlignment: false}
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: {mode: dropNN}
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [100]}
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: warning
          origem: zabbix
        annotations:
          summary: "Fila do Zabbix acumulada em {{ $labels.host }}"
          description: "{{ $values.B.Value }} itens estão há mais de 10 minutos sem coleta (limite: 100). Veja Administration > Queue no Zabbix."
        isPaused: false
